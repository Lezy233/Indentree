<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indentree</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 8px 16px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }
    /* 编辑器容器：backdrop 在底层渲染行级标红，textarea 透明叠加其上 */
    .editor {
      position: relative;
      border-right: 1px solid #ddd;
      min-height: 0;
    }
    .backdrop, #markdown-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      line-height: 1.6;
      padding: 12px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .backdrop {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      color: transparent;
    }
    .backdrop .line-error {
      background: rgba(220, 38, 38, 0.18);
      outline: 1px solid rgba(220, 38, 38, 0.45);
    }
    #markdown-input {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
    }
    #tree-output {
      margin: 0;
      padding: 12px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre;
    }
    #status-bar {
      padding: 4px 16px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      color: #666;
    }
    #status-bar.error {
      color: #b91c1c;
      background: rgba(220, 38, 38, 0.08);
    }
  </style>
</head>
<body>
  <header>Indentree</header>
  <main>
    <div class="editor">
      <div class="backdrop" id="backdrop" aria-hidden="true"></div>
      <textarea id="markdown-input" placeholder="粘贴 Markdown（标题或列表写法）……" spellcheck="false"></textarea>
    </div>
    <pre id="tree-output"></pre>
  </main>
  <footer id="status-bar">就绪</footer>
  <script type="module">
    import {
      parseMarkdown,
      serializeMarkdown,
      renderTreeText,
      MarkdownParseError,
    } from './src/intermediate-tree.mjs';

    const input = document.getElementById('markdown-input');
    const output = document.getElementById('tree-output');
    const backdrop = document.getElementById('backdrop');
    const statusBar = document.getElementById('status-bar');

    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // 行级标红：backdrop 与 textarea 字体/内边距一致，逐行对齐；
    // 空行放零宽空格占位，保证行高一致
    const renderBackdrop = (errorLine) => {
      backdrop.innerHTML = input.value
        .split('\n')
        .map((line, i) => {
          const cls = i + 1 === errorLine ? ' class="line-error"' : '';
          return `<div${cls}>${escapeHtml(line) || '&#8203;'}</div>`;
        })
        .join('');
      backdrop.scrollTop = input.scrollTop;
    };

    const showError = (line) => {
      renderBackdrop(line);
      statusBar.textContent = `第 ${line} 行无法解析`;
      statusBar.classList.add('error');
    };

    const clearError = () => {
      renderBackdrop(null);
      statusBar.textContent = '就绪';
      statusBar.classList.remove('error');
    };

    const sync = () => {
      try {
        output.textContent = renderTreeText(parseMarkdown(input.value));
        clearError();
      } catch (err) {
        showError(err instanceof MarkdownParseError ? err.line : 1);
      }
    };

    input.addEventListener('scroll', () => {
      backdrop.scrollTop = input.scrollTop;
    });

    let timer = null;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(sync, 300);
    });

    // 调试/验收钩子
    window.__indentree = { parseMarkdown, serializeMarkdown, renderTreeText, showError, clearError };

    sync();
  </script>
</body>
</html>
