<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indentree</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --border: #ddd;
      --border-soft: #eee;
      --panel-bg: #fafafa;
      --muted: #666;
      --btn-bg: #fff;
      --btn-hover: #f0f0f0;
      --accent: #2563eb;
      --error-fg: #b91c1c;
      --error-bg: rgba(220, 38, 38, 0.18);
      --error-outline: rgba(220, 38, 38, 0.45);
      --error-bar-bg: rgba(220, 38, 38, 0.08);
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --border: #30363d;
      --border-soft: #21262d;
      --panel-bg: #161b22;
      --muted: #8b949e;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --accent: #4f8cff;
      --error-fg: #f87171;
      --error-bg: rgba(248, 81, 73, 0.25);
      --error-outline: rgba(248, 81, 73, 0.5);
      --error-bar-bg: rgba(248, 81, 73, 0.12);
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    #theme-toggle {
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--fg);
      cursor: pointer;
      font-size: 12px;
      font-weight: 400;
      padding: 2px 10px;
      border-radius: 4px;
    }
    #theme-toggle:hover { background: var(--btn-hover); }
    /* 三栏工作台：圆角卡片 + 栏间 ⋮ 握把分隔条（VSCode 式收放） */
    main {
      flex: 1;
      display: flex;
      min-height: 0;
      padding: 8px;
      position: relative;
    }
    .col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      flex: none;
    }
    .col.center { flex: 1; }
    #col-left { width: 240px; }
    #col-right { width: 280px; }
    .col.collapsed { width: 0 !important; border: none; }
    #ace-editor {
      flex: 1;
      min-height: 0;
    }
    .panel-header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    /* 左栏大纲：按中间树渲染的行列表（缩进视觉 + 行内编辑 + 多选） */
    .outline-body {
      flex: 1;
      overflow: auto;
      padding: 6px 4px;
    }
    .outline-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px 5px calc(8px + var(--depth, 0) * 16px);
      border-radius: 4px;
      font-size: 13px;
      white-space: nowrap;
    }
    .outline-row:hover { background: var(--btn-hover); }
    .outline-row:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
    .outline-row.editing { background: var(--btn-hover); }
    /* 选中态：显式选中强调色，后代「跟随选中」淡一档（同父约束下的整棵子树） */
    .outline-row.selected {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .outline-row.selected:hover {
      background: color-mix(in srgb, var(--accent) 24%, transparent);
    }
    .outline-row.implied { background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .outline-row.implied .sel-box { opacity: 0.55; pointer-events: none; }
    .outline-row .grip {
      color: var(--muted);
      letter-spacing: -2px;
      cursor: grab;
      user-select: none;
    }
    .outline-row .sel-box {
      margin: 0;
      flex: none;
      cursor: pointer;
    }
    /* 「n selected」浮动工具栏：选中 ≥1 项时才出现 */
    .outline-toolbar {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      border-bottom: 1px solid var(--border-soft);
      background: color-mix(in srgb, var(--accent) 10%, var(--panel-bg));
      font-size: 11px;
      color: var(--fg);
    }
    .outline-toolbar.on { display: flex; }
    .outline-toolbar #selection-count {
      white-space: nowrap;
      color: var(--accent);
      font-weight: 600;
    }
    .outline-toolbar button,
    #outline-select-all {
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--fg);
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .outline-toolbar button:hover,
    #outline-select-all:hover { background: var(--btn-hover); }
    #outline-select-all { margin-left: auto; }
    .outline-row[data-kind="heading"] .outline-text,
    .outline-row[data-kind="heading"] .outline-input { font-weight: 600; }
    .outline-text,
    .outline-input {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .outline-text:empty::before {
      content: '空节点';
      color: var(--muted);
      opacity: 0.6;
    }
    .outline-input {
      border: none;
      outline: none;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    .outline-input::placeholder { color: var(--muted); opacity: 0.6; }
    .outline-leaf {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    /* ⋮ 握把分隔条 */
    .gutter {
      width: 12px;
      cursor: col-resize;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      touch-action: none;
    }
    .gutter::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 5px;
      width: 2px;
      background: transparent;
      border-radius: 1px;
      transition: background 0.15s;
    }
    .gutter:hover::before { background: var(--accent); }
    .gutter span {
      color: var(--muted);
      font-size: 11px;
      user-select: none;
      pointer-events: none;
      background: var(--bg);
      padding: 3px 0;
      border-radius: 4px;
    }
    /* 收起态：分隔条变成可反向拖拽的边缘条 */
    .gutter.collapsed { width: 16px; cursor: ew-resize; }
    .gutter.collapsed span { display: none; }
    .gutter.collapsed::before { left: 7px; background: var(--border); }
    .gutter.collapsed:hover::before { background: var(--accent); }
    /* 侧边恢复图标（VSCode 式竖排） */
    .reopen {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;
      display: none;
      align-items: center;
      gap: 4px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 12px 4px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
    }
    .reopen.left { left: 0; border-left: none; border-radius: 0 8px 8px 0; }
    .reopen.right { right: 0; border-right: none; border-radius: 8px 0 0 8px; }
    .reopen.on { display: flex; }
    .reopen:hover { color: var(--accent); border-color: var(--accent); }
    /* 窄屏单栏聚焦：分段切换（头部） + 右侧快速切换条 */
    #view-switch {
      display: none;
      gap: 4px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }
    #view-switch button {
      border: none;
      background: transparent;
      color: var(--fg);
      border-radius: 6px;
      padding: 4px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    #view-switch button.cur { background: var(--accent); color: #fff; }
    .side-switch {
      display: none;
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 60;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 10px 0 0 10px;
    }
    .side-switch button {
      border: none;
      background: transparent;
      font-size: 12px;
      padding: 6px 4px;
      writing-mode: vertical-rl;
      color: var(--muted);
      cursor: pointer;
    }
    .side-switch button.cur { color: var(--accent); font-weight: 700; }
    body.narrow #view-switch { display: flex; }
    body.narrow .side-switch { display: flex; }
    body.narrow .gutter,
    body.narrow .reopen { display: none !important; }
    body.narrow .col {
      display: none;
      width: auto !important;
      border: 1px solid var(--border);
      flex: 1;
    }
    body.narrow .col.active { display: flex; }
    /* Ace 行级标红（解析失败行） */
    .ace-line-error {
      position: absolute;
      background: var(--error-bg);
      outline: 1px solid var(--error-outline);
      z-index: 20;
    }
    /* 暗色主题编辑器配色（参考 One Dark Pro）：
       当前行 #2c313a 微亮、选中区 #3e4451 明显区分、光标 #528bff 品牌蓝 */
    .ace-github-dark .ace_active-line {
      background: #2c313a !important;
    }
    .ace-github-dark .ace_selection {
      background: #3e4451 !important;
    }
    .ace-github-dark .ace_cursor {
      color: #528bff !important;
    }
    /* 覆盖 vim 插件注入的红色 block 光标（.normal-mode .ace_cursor rgba(255,0,0,0.5)） */
    .ace_editor.normal-mode .ace_cursor {
      background-color: rgba(36, 99, 235, 0.45) !important;
    }
    .ace-github-dark.normal-mode .ace_cursor {
      background-color: rgba(82, 139, 255, 0.55) !important;
    }
    /* VSCode vim 方案：visual 模式下取消当前行高亮，避免与选区颜色混淆 */
    .ace_editor.vim-visual .ace_active-line {
      background: transparent !important;
    }
    /* 树形图面板：标题栏 + 抽屉 + 渲染区 */
    .tree-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
      color: var(--muted);
    }
    #drawer-toggle {
      margin-left: auto;
      border: none;
      background: none;
      color: var(--fg);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #drawer-toggle:hover, #drawer-toggle[aria-expanded="true"] {
      background: var(--btn-hover);
    }
    /* 抽屉：二级界面，推开渲染区而非遮挡 */
    #symbol-drawer {
      display: none;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--panel-bg);
      font-size: 12px;
    }
    #symbol-drawer.open { display: block; }
    .drawer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .drawer-row:last-child { margin-bottom: 0; }
    .drawer-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--fg);
    }
    .drawer-row input[type="text"] {
      width: 3.5em;
      padding: 2px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      background: var(--bg);
      color: var(--fg);
    }
    .drawer-row input[type="number"] {
      width: 3.5em;
      padding: 2px 6px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--fg);
    }
    .drawer-row button {
      padding: 2px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--btn-bg);
      color: var(--fg);
      cursor: pointer;
    }
    .drawer-row button:hover { background: var(--btn-hover); }
    #tree-output {
      flex: 1;
      margin: 0;
      padding: 12px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre;
    }
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    #vim-mode {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      min-width: 6em;
    }
    #status-bar.error #status-text {
      color: var(--error-fg);
    }
    #status-bar.error {
      background: var(--error-bar-bg);
    }
  </style>
</head>
<body>
  <header>
    <span>Indentree</span>
    <div id="view-switch" role="tablist" aria-label="视图切换">
      <button type="button" data-view="outline">大纲</button>
      <button type="button" data-view="md" class="cur">Markdown</button>
      <button type="button" data-view="tree">树形图</button>
    </div>
    <button id="theme-toggle" title="切换主题（跟随系统 / 浅色 / 深色）">🖥 跟随系统</button>
  </header>
  <main id="panels">
    <section class="col" id="col-left" aria-label="大纲">
      <div class="panel-header">
        <span class="dot"></span>
        <span>大纲</span>
        <button type="button" id="outline-select-all" title="全选所有顶级节点">全选</button>
      </div>
      <div class="outline-toolbar" id="outline-toolbar">
        <span id="selection-count">0 selected</span>
        <button type="button" data-act="indent" title="整体缩进">缩进</button>
        <button type="button" data-act="outdent" title="整体取消缩进">取消缩进</button>
        <button type="button" data-act="remove" title="删除选中项（含子树）">删除</button>
        <button type="button" data-act="clear" title="清除选择">✕</button>
      </div>
      <div class="outline-body" id="outline-body"></div>
    </section>
    <div class="gutter" data-side="left"><span>⋮</span></div>
    <section class="col center" id="col-center" aria-label="Markdown 编辑器">
      <div class="panel-header">
        <span class="dot"></span>
        <span>Markdown</span>
      </div>
      <div id="ace-editor"></div>
    </section>
    <div class="gutter" data-side="right"><span>⋮</span></div>
    <section class="col tree-panel" id="col-right" aria-label="树形图">
      <div class="panel-header">
        <span class="dot"></span>
        <span>树形图</span>
        <button id="drawer-toggle" title="自定义分支符号" aria-expanded="false">⚙</button>
      </div>
      <div id="symbol-drawer">
        <div class="drawer-row">
          <label>中间分支 <input type="text" id="sym-branch" /></label>
          <label>末分支 <input type="text" id="sym-branch-last" /></label>
          <label>竖线 <input type="text" id="sym-vertical" /></label>
          <label>横线 <input type="text" id="sym-horizontal" /></label>
          <label>长度 <input type="number" id="sym-hlen" min="1" max="8" /></label>
        </div>
        <div class="drawer-row" id="preset-row"></div>
        <div class="drawer-row">
          <button id="copy-link">复制分享链接</button>
          <span id="copy-feedback" style="color:#16a34a"></span>
        </div>
      </div>
      <pre id="tree-output"></pre>
    </section>
    <button type="button" class="reopen left" id="reopen-left">☰ 大纲</button>
    <button type="button" class="reopen right" id="reopen-right">🌲 树形图</button>
  </main>
  <div class="side-switch" id="side-switch" aria-label="快速切换视图">
    <button type="button" data-view="outline">大纲</button>
    <button type="button" data-view="md" class="cur">文本</button>
    <button type="button" data-view="tree">树</button>
  </div>
  <footer id="status-bar">
    <span id="vim-mode"></span>
    <span id="status-text">就绪</span>
  </footer>
  <script src="./vendor/ace/ace.js"></script>
  <script src="./vendor/ace/keybinding-vim.js"></script>
  <script src="./vendor/ace/mode-markdown.js"></script>
  <script src="./vendor/ace/theme-github.js"></script>
  <script src="./vendor/ace/theme-github_dark.js"></script>
  <script type="module">
    import {
      parseMarkdown,
      serializeMarkdown,
      renderTreeText,
      MarkdownParseError,
    } from './src/intermediate-tree.mjs';
    import {
      PRESETS,
      resolveSymbols,
      symbolsFromSearch,
      symbolsToSearch,
    } from './src/tree-symbols.mjs';
    import {
      NARROW_BREAKPOINT,
      dragTargetWidth,
      resolveLayout,
      serializeLayout,
      snapPanel,
      commitDrag,
    } from './src/panel-layout.mjs';
    import {
      outlineRows,
      locateNode,
      setNodeText,
      insertSibling,
      indentNode,
      outdentNode,
      removeNode,
      indentNodes,
      outdentNodes,
      removeNodes,
      describeOutlineReason,
      pathKey,
      parsePath,
    } from './src/outline.mjs';
    import {
      emptySelection,
      toggleSelection,
      extendSelection,
      selectAllTopLevel,
      impliedSelection,
      pruneSelection,
      describeSelectionHint,
    } from './src/outline-selection.mjs';

    const STORAGE_KEY = 'indentree:tree-symbols';
    const THEME_KEY = 'indentree:theme';

    const output = document.getElementById('tree-output');
    const statusBar = document.getElementById('status-bar');
    const statusText = document.getElementById('status-text');
    const vimModeEl = document.getElementById('vim-mode');

    // ---- 主题：跟随系统（auto）/ 浅色 / 深色，Ace 主题联动 ----
    const themeToggle = document.getElementById('theme-toggle');
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    const THEME_CYCLE = ['auto', 'light', 'dark'];
    const THEME_LABELS = { auto: '🖥 跟随系统', light: '☀ 浅色', dark: '🌙 深色' };
    let themeSetting = localStorage.getItem(THEME_KEY) ?? 'auto';

    const resolvedTheme = () =>
      themeSetting === 'auto' ? (themeMedia.matches ? 'dark' : 'light') : themeSetting;

    let editor = null; // 下方初始化后赋值
    const applyTheme = () => {
      const resolved = resolvedTheme();
      document.documentElement.dataset.theme = resolved;
      themeToggle.textContent = THEME_LABELS[themeSetting];
      editor?.setTheme(resolved === 'dark' ? 'ace/theme/github_dark' : 'ace/theme/github');
    };
    themeToggle.addEventListener('click', () => {
      themeSetting = THEME_CYCLE[(THEME_CYCLE.indexOf(themeSetting) + 1) % THEME_CYCLE.length];
      localStorage.setItem(THEME_KEY, themeSetting);
      applyTheme();
    });
    themeMedia.addEventListener('change', () => {
      if (themeSetting === 'auto') applyTheme();
    });

    // ---- Ace 编辑器（vim 模式） ----
    const SAMPLE = ['# 欢迎使用 Indentree', '', '- 左侧用 vim 键位编辑 Markdown', '  - 按 i 进入插入模式', '  - 按 Esc 返回普通模式', '- 右侧树形图实时跟随'].join('\n');
    ace.config.set('basePath', './vendor/ace');
    editor = ace.edit('ace-editor', {
      mode: 'ace/mode/markdown',
      keyboardHandler: 'ace/keyboard/vim',
      value: SAMPLE,
      showPrintMargin: false,
      useWorker: false,
      fontSize: 14,
    });
    const Range = ace.require('ace/range').Range;

    // vim 模式显示：官方 getStatusText 返回 INSERT / VISUAL…，空串即 NORMAL
    const updateVimMode = () => {
      const text = editor.keyBinding.getStatusText?.(editor) ?? '';
      vimModeEl.textContent = text === '' ? 'NORMAL' : text;
      // visual 模式挂类名，CSS 据此取消当前行高亮（VSCode vim 方案）
      editor.container.classList.toggle('vim-visual', text.startsWith('VISUAL'));
    };
    editor.on('changeStatus', updateVimMode);
    updateVimMode();

    // vim Esc 兜底：某些环境（中文 IME、嵌入容器）会吞掉 textarea 上的
    // Escape / Ctrl+[；在捕获阶段直接喂给 vim handler。
    // 若 ace 自己也能处理，重复退出普通模式是无害空操作。
    editor.container.addEventListener(
      'keydown',
      (e) => {
        const isEsc = e.key === 'Escape';
        const isCtrlBracket = e.key === '[' && e.ctrlKey;
        if (!isEsc && !isCtrlBracket) return;
        const handler = editor.keyBinding.$handlers?.[editor.keyBinding.$handlers.length - 1];
        const vim = editor.state?.cm?.state?.vim;
        if (!handler?.handleKeyboard || !vim) return;
        if (!vim.insertMode && !vim.visualMode) return; // 仅在插入/可视模式兜底
        handler.handleKeyboard({ editor }, 0, 'esc', 27, e);
        e.preventDefault();
        e.stopPropagation();
      },
      true,
    );

    // 宽字符 block 光标：ace 的光标层定位已按全角计 2 列，但块宽固定 1 字符，
    // 光标落在汉字/全角符号上时只盖住一半。每次光标渲染后按字符实测宽度修正。
    // visual 正向选区时 vim 的 drawCursor 会把块画在 lead 左侧那个字符上、
    // 却只按 1× 宽度左移；宽字符时需以 lead 左边字符定宽、再补左移 1×。
    const WIDE_CHAR =
      /[ᄀ-ᅟ⺀-〾぀-ヿ㐀-䶿一-鿿ꥠ-꥿가-힯豈-﫿︰-﹏＀-｠￠-￦]/;
    const fixWideCursor = () => {
      const vim = editor.state?.cm?.state?.vim;
      if (vim?.insertMode) {
        // 从 visual 宽字符补偿切回细光标时清掉左移
        editor.container.querySelectorAll('.ace_cursor-layer .ace_cursor').forEach((c) => {
          if (c.style.marginLeft !== '') c.style.marginLeft = '';
        });
        return;
      }
      const sel = editor.selection;
      const pos = editor.getCursorPosition(); // lead
      const line = editor.session.getLine(pos.row) ?? '';
      const charWidth = editor.renderer.characterWidth;
      // 正向非空选区：块盖在 lead 左边那个字符上
      const forward = !sel.isEmpty() && !sel.isBackwards();
      const col = forward && pos.column > 0 ? pos.column - 1 : pos.column;
      const ch = line.charAt(col);
      let cp = line.codePointAt(col);
      // col 落在代理对低半时取完整码点
      if (ch >= '\udc00' && ch <= '\udfff' && col > 0) cp = line.codePointAt(col - 1);
      const wide = ch !== '' && (cp > 0xffff || WIDE_CHAR.test(ch));
      const width = `${charWidth * (wide ? 2 : 1)}px`;
      // 正向选区 + 宽字符：ace 只预留 1× 左移，需再补 1×
      const shift = forward && wide ? `${-charWidth}px` : '';
      editor.container.querySelectorAll('.ace_cursor-layer .ace_cursor').forEach((c) => {
        if (c.style.width !== width) c.style.width = width;
        if (c.style.marginLeft !== shift) c.style.marginLeft = shift;
      });
    };
    // MutationObserver：光标层每次重绘后同步修正宽度（微任务在渲染前执行，不依赖 rAF）
    const cursorLayer = editor.container.querySelector('.ace_cursor-layer');
    if (cursorLayer) {
      new MutationObserver(fixWideCursor).observe(cursorLayer, {
        attributes: true,
        attributeFilter: ['style'],
        subtree: true,
      });
    }
    // 选择变更时立即修正一次（渲染前先行设置，重绘后由 observer 兜底）
    editor.on('changeSelection', fixWideCursor);
    editor.on('changeStatus', fixWideCursor);

    // 跨视图编辑后的 Ace 重建：按行号恢复光标，撤销栈清空为已接受代价
    const rebuildEditor = (text) => {
      if (text === editor.getValue()) return;
      const { row, column } = editor.getCursorPosition();
      editor.session.setValue(text);
      editor.moveCursorTo(Math.min(row, editor.session.getLength() - 1), column);
      editor.clearSelection();
    };

    // ---- 分支符号设置：默认 < localStorage < URL 参数 ----
    const loadStored = () => {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? {};
      } catch {
        return {};
      }
    };
    const hasUrlOverride = Object.keys(symbolsFromSearch(location.search)).length > 0;
    let symbols = resolveSymbols({ stored: loadStored(), urlSearch: location.search });
    const persist = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(symbols));
    if (hasUrlOverride) persist(); // URL 分享载入后写穿，刷新不丢

    // ---- 抽屉 ----
    const drawer = document.getElementById('symbol-drawer');
    const drawerToggle = document.getElementById('drawer-toggle');
    drawerToggle.addEventListener('click', () => {
      const open = drawer.classList.toggle('open');
      drawerToggle.setAttribute('aria-expanded', String(open));
    });

    const fields = {
      branch: document.getElementById('sym-branch'),
      branchLast: document.getElementById('sym-branch-last'),
      vertical: document.getElementById('sym-vertical'),
      horizontal: document.getElementById('sym-horizontal'),
      horizontalLength: document.getElementById('sym-hlen'),
    };
    const reflectFields = () => {
      fields.branch.value = symbols.branch;
      fields.branchLast.value = symbols.branchLast;
      fields.vertical.value = symbols.vertical;
      fields.horizontal.value = symbols.horizontal;
      fields.horizontalLength.value = String(symbols.horizontalLength);
    };
    const applySymbols = (next) => {
      symbols = { ...symbols, ...next };
      persist();
      reflectFields();
      renderTree();
    };
    for (const [key, el] of Object.entries(fields)) {
      el.addEventListener('input', () => {
        const value = key === 'horizontalLength' ? Number(el.value) : el.value;
        if (key === 'horizontalLength' && !(value >= 1 && value <= 8)) return;
        if (key !== 'horizontalLength' && value === '') return;
        applySymbols({ [key]: value });
      });
    }

    const presetRow = document.getElementById('preset-row');
    for (const [id, preset] of Object.entries(PRESETS)) {
      const btn = document.createElement('button');
      btn.textContent = preset.label;
      btn.dataset.preset = id;
      btn.addEventListener('click', () => applySymbols(preset.symbols));
      presetRow.appendChild(btn);
    }

    const copyFeedback = document.getElementById('copy-feedback');
    document.getElementById('copy-link').addEventListener('click', async () => {
      const url = `${location.origin}${location.pathname}${symbolsToSearch(symbols)}`;
      await navigator.clipboard.writeText(url);
      copyFeedback.textContent = '已复制';
      setTimeout(() => (copyFeedback.textContent = ''), 1500);
    });

    // ---- 三栏布局：拖拽调宽 / 推到底收起 / 侧边恢复 / 持久化 ----
    const LAYOUT_KEY = 'indentree:layout';
    const cols = {
      left: document.getElementById('col-left'),
      right: document.getElementById('col-right'),
    };
    const gutters = {
      left: document.querySelector('.gutter[data-side="left"]'),
      right: document.querySelector('.gutter[data-side="right"]'),
    };
    const reopens = {
      left: document.getElementById('reopen-left'),
      right: document.getElementById('reopen-right'),
    };
    const loadLayoutStored = () => {
      try {
        return JSON.parse(localStorage.getItem(LAYOUT_KEY));
      } catch {
        return null;
      }
    };
    const layout = resolveLayout(loadLayoutStored());
    const persistLayout = () =>
      localStorage.setItem(LAYOUT_KEY, JSON.stringify(serializeLayout(layout)));
    const applySide = (side, st = layout[side]) => {
      cols[side].classList.toggle('collapsed', st.collapsed);
      gutters[side].classList.toggle('collapsed', st.collapsed);
      reopens[side].classList.toggle('on', st.collapsed);
      cols[side].style.width = st.collapsed ? '' : `${st.width}px`;
      editor.resize();
    };
    for (const side of ['left', 'right']) {
      gutters[side].addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = layout[side].collapsed ? 0 : cols[side].getBoundingClientRect().width;
        const widthBeforeDrag = layout[side].width; // 拖动前的恢复宽度
        document.body.style.userSelect = 'none';
        const move = (ev) => {
          // 拖动全程只改视觉，不写 layout.width——否则拖到收起时
          // 恢复宽度已缩水成 64px 细缝，点恢复图标拉不回原宽
          applySide(side, snapPanel(
            dragTargetWidth(side, startW, ev.clientX - startX),
            window.innerWidth,
          ));
        };
        const up = (ev) => {
          removeEventListener('pointermove', move);
          removeEventListener('pointerup', up);
          document.body.style.userSelect = '';
          const snap = snapPanel(
            dragTargetWidth(side, startW, ev.clientX - startX),
            window.innerWidth,
          );
          Object.assign(layout[side], commitDrag(widthBeforeDrag, snap));
          applySide(side);
          persistLayout();
        };
        addEventListener('pointermove', move);
        addEventListener('pointerup', up);
      });
      reopens[side].addEventListener('click', () => {
        layout[side].collapsed = false;
        applySide(side);
        persistLayout();
      });
    }

    // ---- 窄屏（<720px）单栏聚焦：分段切换 + 右侧快速切换条 ----
    const narrowMq = window.matchMedia(`(max-width: ${NARROW_BREAKPOINT - 1}px)`);
    const VIEW_COLS = { outline: 'col-left', md: 'col-center', tree: 'col-right' };
    const viewSwitch = document.getElementById('view-switch');
    const sideSwitch = document.getElementById('side-switch');
    let narrowView = 'md';
    const applyNarrowView = () => {
      for (const [view, id] of Object.entries(VIEW_COLS)) {
        document.getElementById(id).classList.toggle('active', view === narrowView);
      }
      for (const root of [viewSwitch, sideSwitch]) {
        root.querySelectorAll('button').forEach((b) => {
          b.classList.toggle('cur', b.dataset.view === narrowView);
        });
      }
      editor.resize();
    };
    for (const root of [viewSwitch, sideSwitch]) {
      root.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-view]');
        if (!btn) return;
        narrowView = btn.dataset.view;
        applyNarrowView();
      });
    }
    const applyViewportMode = () => {
      document.body.classList.toggle('narrow', narrowMq.matches);
      applyNarrowView();
    };
    narrowMq.addEventListener('change', applyViewportMode);

    // ---- 错误行级标红（Ace marker）与状态条 ----
    let errorMarkerId = null;
    const showError = (line) => {
      clearErrorMarker();
      errorMarkerId = editor.session.addMarker(
        new Range(line - 1, 0, line - 1, 1),
        'ace-line-error',
        'fullLine',
      );
      statusText.textContent = `第 ${line} 行无法解析`;
      statusBar.classList.add('error');
    };
    const clearErrorMarker = () => {
      if (errorMarkerId !== null) {
        editor.session.removeMarker(errorMarkerId);
        errorMarkerId = null;
      }
    };
    const clearError = () => {
      clearErrorMarker();
      statusText.textContent = '就绪';
      statusBar.classList.remove('error');
    };

    // ---- 中间树：三视图共同的单一数据源 ----
    // 编辑器与大纲的编辑都先落到它，再重渲染其它视图
    let tree = parseMarkdown(SAMPLE);

    function renderTree() {
      output.textContent = renderTreeText(tree, symbols);
    }

    // Markdown 栏编辑 → 防抖回流中间树 → 重渲染树形图与大纲
    function syncFromEditor() {
      try {
        tree = parseMarkdown(editor.getValue());
        renderTree();
        renderOutline();
        clearError();
      } catch (err) {
        showError(err instanceof MarkdownParseError ? err.line : 1);
      }
    }

    // 大纲编辑 → 防抖回流中间树 → 重写 Markdown 栏与树形图（300ms 内刷新）
    // lastOutlineText 记录「最后一次由大纲写回编辑器的文本」，用于识别
    // 编辑器 change 是否由本次写回触发（否则会把大纲的新改动误判成外部编辑）
    let lastOutlineText = null;
    let editorTimer = null;
    let outlineTimer = null;
    function syncFromOutline() {
      clearTimeout(outlineTimer);
      outlineTimer = setTimeout(() => {
        const text = serializeMarkdown(tree);
        if (text !== editor.getValue()) {
          lastOutlineText = text;
          rebuildEditor(text);
        }
        renderTree();
      }, 300);
    }

    // 进入行内编辑前把挂起的 Markdown 防抖同步先落地：否则它会在稍后触发，
    // 用编辑器里的旧文本重新解析并覆盖刚提交的大纲改动
    function flushEditorSync() {
      if (editorTimer === null) return; // 没有待落地的 Markdown 改动
      clearTimeout(editorTimer);
      editorTimer = null;
      if (editor.getValue() === lastOutlineText) return;
      syncFromEditor();
    }

    // ---- 大纲视图：按中间树渲染 + 行内编辑 + 多选 + 结构操作 ----
    const outlineBody = document.getElementById('outline-body');
    const outlineToolbar = document.getElementById('outline-toolbar');
    const selectionCount = document.getElementById('selection-count');
    let activeEdit = null; // { path, input }
    let selection = emptySelection(); // { paths, anchor }，同父约束见 ADR-0001

    let statusTimer = null;
    function flashStatus(message) {
      clearTimeout(statusTimer);
      statusBar.classList.remove('error');
      statusText.textContent = message;
      statusTimer = setTimeout(() => {
        statusText.textContent = '就绪';
      }, 2400);
    }

    // 把选择状态写进 DOM（行高亮 / checkbox / 工具栏），不重建行——保住滚动位置
    function applySelectionVisuals(rows = outlineRows(tree)) {
      const explicit = new Set(selection.paths.map(pathKey));
      const implied = new Set(impliedSelection(rows, selection).map(pathKey));
      for (const el of outlineBody.children) {
        const key = el.dataset.path;
        el.classList.toggle('selected', explicit.has(key));
        el.classList.toggle('implied', implied.has(key));
        const box = el.querySelector('.sel-box');
        if (box) box.checked = explicit.has(key) || implied.has(key);
      }
      selectionCount.textContent = `${selection.paths.length} selected`;
      outlineToolbar.classList.toggle('on', selection.paths.length > 0);
    }

    // 选择变化的统一入口：状态 + 视觉 + 提示
    function applySelection(next, hint) {
      selection = next;
      applySelectionVisuals();
      const message = describeSelectionHint(hint);
      if (message) flashStatus(message);
    }

    function clearSelection() {
      applySelection(emptySelection(), null);
    }

    function buildRow(row) {
      const el = document.createElement('div');
      el.className = 'outline-row';
      el.dataset.path = pathKey(row.path);
      el.dataset.kind = row.kind;
      el.tabIndex = -1;
      el.style.setProperty('--depth', String(row.depth));

      const grip = document.createElement('span');
      grip.className = 'grip';
      grip.textContent = '⠿';
      grip.setAttribute('aria-hidden', 'true');
      el.appendChild(grip);

      // 多选 checkbox：同父约束下点选切换；后代「跟随选中」由 applySelectionVisuals 标灰
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.className = 'sel-box';
      box.setAttribute('aria-label', row.text ? `选择：${row.text.split('\n')[0]}` : '选择空节点');
      el.appendChild(box);

      if (row.kind === 'leaf-block') {
        const leaf = document.createElement('span');
        leaf.className = 'outline-leaf';
        const [first, ...rest] = row.text.split('\n');
        leaf.textContent = rest.length > 0 ? `${first} ⋯ 共 ${rest.length + 1} 行` : first;
        leaf.title = '叶子块请在 Markdown 栏编辑';
        el.appendChild(leaf);
        return el;
      }

      const text = document.createElement('span');
      text.className = 'outline-text';
      text.textContent = row.text;
      el.appendChild(text);
      return el;
    }

    function renderOutline({ force = false } = {}) {
      if (activeEdit && !force) return; // 正在行内编辑时不被外部刷新打断
      activeEdit = null;
      const rows = outlineRows(tree);
      selection = pruneSelection(rows, selection); // 树变了，丢掉失效的选择
      outlineBody.textContent = '';
      for (const row of rows) outlineBody.appendChild(buildRow(row));
      applySelectionVisuals(rows);
    }

    function startEdit(path) {
      if (!Array.isArray(path)) return;
      flushEditorSync(); // 先把挂起的 Markdown 改动落地，再按最新的树定位行
      const rowEl = outlineBody.querySelector(`.outline-row[data-path="${pathKey(path)}"]`);
      const loc = rowEl ? locateNode(tree, path) : null;
      if (!rowEl || !loc || rowEl.dataset.kind === 'leaf-block') return;
      const span = rowEl.querySelector('.outline-text');
      if (!span) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'outline-input';
      input.value = loc.node.text;
      input.placeholder = '输入内容…';
      input.setAttribute('aria-label', '节点文本');
      span.replaceWith(input);
      rowEl.classList.add('editing');
      activeEdit = { path, input };
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      input.addEventListener('keydown', (e) => onEditKeydown(e, path));
      input.addEventListener('blur', finishEdit);
    }

    function commitEdit() {
      if (!activeEdit) return null;
      const { path, input } = activeEdit;
      activeEdit = null; // 先清状态，重建 DOM 触发的 blur 不再重复提交
      const result = setNodeText(tree, path, input.value);
      if (result.applied) tree = result.tree;
      return path;
    }

    function finishEdit() {
      if (!activeEdit) return;
      commitEdit();
      renderOutline({ force: true });
      syncFromOutline();
    }

    // 结构操作结果 → 中间树 + 重渲染 + 继续编辑落点
    // （被拒绝时状态条提示，并留在原节点继续编辑）
    function applyOutlineResult(result, currentPath) {
      if (!result.applied) {
        flashStatus(describeOutlineReason(result.reason));
        renderOutline({ force: true });
        startEdit(currentPath);
        return;
      }
      tree = result.tree;
      renderOutline({ force: true });
      syncFromOutline();
      if (result.paths[0]) startEdit(result.paths[0]);
    }

    // 工具栏批量操作：整段缩进 / 取消缩进 / 删除（同父 + 连续，见 ADR-0001）
    const BATCH_OPS = {
      indent: indentNodes,
      outdent: outdentNodes,
      remove: removeNodes,
    };

    function runBatchOperation(act) {
      const op = BATCH_OPS[act]; // 未知 data-act 直接忽略，绝不能落到删除
      if (!op || selection.paths.length === 0) return;
      const result = op(tree, selection.paths);
      if (!result.applied) {
        flashStatus(describeOutlineReason(result.reason));
        return;
      }
      tree = result.tree;
      // 删除后清空选择；整体移动后选中项跟着落到新位置，方便连续调整
      selection =
        op === removeNodes
          ? emptySelection()
          : { paths: result.paths, anchor: result.paths[0] ?? null };
      renderOutline({ force: true });
      syncFromOutline();
    }

    function onEditKeydown(e, path) {
      if (e.key === 'Enter') {
        e.preventDefault();
        commitEdit();
        applyOutlineResult(insertSibling(tree, path), path);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        commitEdit();
        applyOutlineResult(e.shiftKey ? outdentNode(tree, path) : indentNode(tree, path), path);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        finishEdit();
      } else if (e.key === 'Backspace' && e.target.value === '') {
        e.preventDefault();
        activeEdit = null; // 空节点连同未提交的空文本一起删掉
        applyOutlineResult(removeNode(tree, path), path);
      }
    }

    // 单击行聚焦（再按 Enter 进入编辑），双击进入编辑
    outlineBody.addEventListener('mousedown', (e) => {
      const row = e.target.closest?.('.outline-row');
      if (!row || e.target.closest('.outline-input')) return;
      row.focus();
    });
    outlineBody.addEventListener('dblclick', (e) => {
      const row = e.target.closest?.('.outline-row');
      if (!row) return;
      if (row.dataset.kind === 'leaf-block') {
        flashStatus('叶子块请在 Markdown 栏编辑');
        return;
      }
      startEdit(parsePath(row.dataset.path));
    });
    outlineBody.addEventListener('keydown', (e) => {
      const row = e.target.closest?.('.outline-row');
      if (activeEdit || !row || e.target !== row) return; // 行内编辑的按键由 input 处理
      if (e.key === 'Enter') {
        e.preventDefault();
        startEdit(parsePath(row.dataset.path));
      } else if (e.key === 'Escape' && selection.paths.length > 0) {
        e.preventDefault();
        clearSelection();
      }
    });

    // checkbox 点选切换；Shift 连选（同父约束 + 越界截断）
    outlineBody.addEventListener('click', (e) => {
      const box = e.target.closest?.('.sel-box');
      if (!box) return;
      const row = box.closest('.outline-row');
      const path = parsePath(row.dataset.path);
      const rows = outlineRows(tree);
      const result = e.shiftKey
        ? extendSelection(rows, selection, path)
        : toggleSelection(selection, path);
      applySelection(result.selection, result.hint);
    });

    // 全选 = 所有顶级节点（同父；后代跟随）
    document.getElementById('outline-select-all').addEventListener('click', () => {
      const result = selectAllTopLevel(outlineRows(tree));
      if (result.selection.paths.length === 0) {
        flashStatus('当前没有可选的节点');
        return;
      }
      applySelection(result.selection, result.hint);
    });

    outlineToolbar.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      if (btn.dataset.act === 'clear') clearSelection();
      else runBatchOperation(btn.dataset.act);
    });

    // ---- 防抖同步：Markdown 栏改动 ----
    editor.session.on('change', () => {
      clearTimeout(editorTimer);
      editorTimer = setTimeout(() => {
        editorTimer = null;
        // 大纲写回的文本，无需再解析回流
        if (editor.getValue() === lastOutlineText) return;
        syncFromEditor();
      }, 300);
    });

    // 调试/验收钩子
    window.__indentree = {
      parseMarkdown,
      serializeMarkdown,
      renderTreeText,
      showError,
      clearError,
      getSymbols: () => symbols,
      applySymbols,
      rebuildEditor,
      editor,
      layout,
      applySide,
      getTree: () => tree,
      outlineRows,
      renderOutline,
      startEdit,
      syncFromOutline,
      getSelection: () => selection,
      applySelection,
      clearSelection,
      runBatchOperation,
    };

    applyTheme();
    reflectFields();
    applySide('left');
    applySide('right');
    applyViewportMode();
    renderTree();
    renderOutline();
  </script>
</body>
</html>
