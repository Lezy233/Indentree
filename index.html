<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indentree</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --border: #ddd;
      --border-soft: #eee;
      --panel-bg: #fafafa;
      --muted: #666;
      --btn-bg: #fff;
      --btn-hover: #f0f0f0;
      --error-fg: #b91c1c;
      --error-bg: rgba(220, 38, 38, 0.18);
      --error-outline: rgba(220, 38, 38, 0.45);
      --error-bar-bg: rgba(220, 38, 38, 0.08);
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --border: #30363d;
      --border-soft: #21262d;
      --panel-bg: #161b22;
      --muted: #8b949e;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --error-fg: #f87171;
      --error-bg: rgba(248, 81, 73, 0.25);
      --error-outline: rgba(248, 81, 73, 0.5);
      --error-bar-bg: rgba(248, 81, 73, 0.12);
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    #theme-toggle {
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--fg);
      cursor: pointer;
      font-size: 12px;
      font-weight: 400;
      padding: 2px 10px;
      border-radius: 4px;
    }
    #theme-toggle:hover { background: var(--btn-hover); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }
    #ace-editor {
      height: 100%;
      border-right: 1px solid var(--border);
    }
    /* Ace 行级标红（解析失败行） */
    .ace-line-error {
      position: absolute;
      background: var(--error-bg);
      outline: 1px solid var(--error-outline);
      z-index: 20;
    }
    /* 暗色主题编辑器配色（参考 One Dark Pro）：
       当前行 #2c313a 微亮、选中区 #3e4451 明显区分、光标 #528bff 品牌蓝 */
    .ace-github-dark .ace_active-line {
      background: #2c313a !important;
    }
    .ace-github-dark .ace_selection {
      background: #3e4451 !important;
    }
    .ace-github-dark .ace_cursor {
      color: #528bff !important;
    }
    /* 树形图面板：标题栏 + 抽屉 + 渲染区 */
    .tree-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
      color: var(--muted);
    }
    #drawer-toggle {
      border: none;
      background: none;
      color: var(--fg);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #drawer-toggle:hover, #drawer-toggle[aria-expanded="true"] {
      background: var(--btn-hover);
    }
    /* 抽屉：二级界面，推开渲染区而非遮挡 */
    #symbol-drawer {
      display: none;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--panel-bg);
      font-size: 12px;
    }
    #symbol-drawer.open { display: block; }
    .drawer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .drawer-row:last-child { margin-bottom: 0; }
    .drawer-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--fg);
    }
    .drawer-row input[type="text"] {
      width: 3.5em;
      padding: 2px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      background: var(--bg);
      color: var(--fg);
    }
    .drawer-row input[type="number"] {
      width: 3.5em;
      padding: 2px 6px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--fg);
    }
    .drawer-row button {
      padding: 2px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--btn-bg);
      color: var(--fg);
      cursor: pointer;
    }
    .drawer-row button:hover { background: var(--btn-hover); }
    #tree-output {
      flex: 1;
      margin: 0;
      padding: 12px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre;
    }
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    #vim-mode {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      min-width: 6em;
    }
    #status-bar.error #status-text {
      color: var(--error-fg);
    }
    #status-bar.error {
      background: var(--error-bar-bg);
    }
  </style>
</head>
<body>
  <header>
    <span>Indentree</span>
    <button id="theme-toggle" title="切换主题（跟随系统 / 浅色 / 深色）">🖥 跟随系统</button>
  </header>
  <main>
    <div id="ace-editor"></div>
    <div class="tree-panel">
      <div class="panel-header">
        <span>树形图</span>
        <button id="drawer-toggle" title="自定义分支符号" aria-expanded="false">⚙</button>
      </div>
      <div id="symbol-drawer">
        <div class="drawer-row">
          <label>中间分支 <input type="text" id="sym-branch" /></label>
          <label>末分支 <input type="text" id="sym-branch-last" /></label>
          <label>竖线 <input type="text" id="sym-vertical" /></label>
          <label>横线 <input type="text" id="sym-horizontal" /></label>
          <label>长度 <input type="number" id="sym-hlen" min="1" max="8" /></label>
        </div>
        <div class="drawer-row" id="preset-row"></div>
        <div class="drawer-row">
          <button id="copy-link">复制分享链接</button>
          <span id="copy-feedback" style="color:#16a34a"></span>
        </div>
      </div>
      <pre id="tree-output"></pre>
    </div>
  </main>
  <footer id="status-bar">
    <span id="vim-mode"></span>
    <span id="status-text">就绪</span>
  </footer>
  <script src="./vendor/ace/ace.js"></script>
  <script src="./vendor/ace/keybinding-vim.js"></script>
  <script src="./vendor/ace/mode-markdown.js"></script>
  <script src="./vendor/ace/theme-github.js"></script>
  <script src="./vendor/ace/theme-github_dark.js"></script>
  <script type="module">
    import {
      parseMarkdown,
      serializeMarkdown,
      renderTreeText,
      MarkdownParseError,
    } from './src/intermediate-tree.mjs';
    import {
      PRESETS,
      resolveSymbols,
      symbolsFromSearch,
      symbolsToSearch,
    } from './src/tree-symbols.mjs';

    const STORAGE_KEY = 'indentree:tree-symbols';
    const THEME_KEY = 'indentree:theme';

    const output = document.getElementById('tree-output');
    const statusBar = document.getElementById('status-bar');
    const statusText = document.getElementById('status-text');
    const vimModeEl = document.getElementById('vim-mode');

    // ---- 主题：跟随系统（auto）/ 浅色 / 深色，Ace 主题联动 ----
    const themeToggle = document.getElementById('theme-toggle');
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    const THEME_CYCLE = ['auto', 'light', 'dark'];
    const THEME_LABELS = { auto: '🖥 跟随系统', light: '☀ 浅色', dark: '🌙 深色' };
    let themeSetting = localStorage.getItem(THEME_KEY) ?? 'auto';

    const resolvedTheme = () =>
      themeSetting === 'auto' ? (themeMedia.matches ? 'dark' : 'light') : themeSetting;

    let editor = null; // 下方初始化后赋值
    const applyTheme = () => {
      const resolved = resolvedTheme();
      document.documentElement.dataset.theme = resolved;
      themeToggle.textContent = THEME_LABELS[themeSetting];
      editor?.setTheme(resolved === 'dark' ? 'ace/theme/github_dark' : 'ace/theme/github');
    };
    themeToggle.addEventListener('click', () => {
      themeSetting = THEME_CYCLE[(THEME_CYCLE.indexOf(themeSetting) + 1) % THEME_CYCLE.length];
      localStorage.setItem(THEME_KEY, themeSetting);
      applyTheme();
    });
    themeMedia.addEventListener('change', () => {
      if (themeSetting === 'auto') applyTheme();
    });

    // ---- Ace 编辑器（vim 模式） ----
    const SAMPLE = ['# 欢迎使用 Indentree', '', '- 左侧用 vim 键位编辑 Markdown', '  - 按 i 进入插入模式', '  - 按 Esc 返回普通模式', '- 右侧树形图实时跟随'].join('\n');
    ace.config.set('basePath', './vendor/ace');
    editor = ace.edit('ace-editor', {
      mode: 'ace/mode/markdown',
      keyboardHandler: 'ace/keyboard/vim',
      value: SAMPLE,
      showPrintMargin: false,
      useWorker: false,
      fontSize: 14,
    });
    const Range = ace.require('ace/range').Range;

    // vim 模式显示：官方 getStatusText 返回 INSERT / VISUAL…，空串即 NORMAL
    const updateVimMode = () => {
      const text = editor.keyBinding.getStatusText?.(editor) ?? '';
      vimModeEl.textContent = text === '' ? 'NORMAL' : text;
    };
    editor.on('changeStatus', updateVimMode);
    updateVimMode();

    // vim Esc 兜底：某些环境（中文 IME、嵌入容器）会吞掉 textarea 上的
    // Escape / Ctrl+[；在捕获阶段直接喂给 vim handler。
    // 若 ace 自己也能处理，重复退出普通模式是无害空操作。
    editor.container.addEventListener(
      'keydown',
      (e) => {
        const isEsc = e.key === 'Escape';
        const isCtrlBracket = e.key === '[' && e.ctrlKey;
        if (!isEsc && !isCtrlBracket) return;
        const handler = editor.keyBinding.$handlers?.[editor.keyBinding.$handlers.length - 1];
        const vim = editor.state?.cm?.state?.vim;
        if (!handler?.handleKeyboard || !vim) return;
        if (!vim.insertMode && !vim.visualMode) return; // 仅在插入/可视模式兜底
        handler.handleKeyboard({ editor }, 0, 'esc', 27, e);
        e.preventDefault();
        e.stopPropagation();
      },
      true,
    );

    // 宽字符 block 光标：ace 的光标层定位已按全角计 2 列，但块宽固定 1 字符，
    // 光标落在汉字/全角符号上时只盖住一半。每次光标渲染后按字符实测宽度修正。
    const WIDE_CHAR =
      /[ᄀ-ᅟ⺀-〾぀-ヿ㐀-䶿一-鿿ꥠ-꥿가-힯豈-﫿︰-﹏＀-｠￠-￦]/;
    const fixWideCursor = () => {
      const vim = editor.state?.cm?.state?.vim;
      if (vim?.insertMode) return; // 插入模式是细光标，无需处理
      const pos = editor.getCursorPosition();
      const line = editor.session.getLine(pos.row) ?? '';
      const ch = line.charAt(pos.column);
      const cp = line.codePointAt(pos.column);
      const wide = ch !== '' && (cp > 0xffff || WIDE_CHAR.test(ch));
      const width = `${editor.renderer.characterWidth * (wide ? 2 : 1)}px`;
      editor.container.querySelectorAll('.ace_cursor-layer .ace_cursor').forEach((c) => {
        if (c.style.width !== width) c.style.width = width;
      });
    };
    // MutationObserver：光标层每次重绘后同步修正宽度（微任务在渲染前执行，不依赖 rAF）
    const cursorLayer = editor.container.querySelector('.ace_cursor-layer');
    if (cursorLayer) {
      new MutationObserver(fixWideCursor).observe(cursorLayer, {
        attributes: true,
        attributeFilter: ['style'],
        subtree: true,
      });
    }
    // 选择变更时立即修正一次（渲染前先行设置，重绘后由 observer 兜底）
    editor.on('changeSelection', fixWideCursor);
    editor.on('changeStatus', fixWideCursor);

    // 跨视图编辑后的 Ace 重建：按行号恢复光标，撤销栈清空为已接受代价
    const rebuildEditor = (text) => {
      if (text === editor.getValue()) return;
      const { row, column } = editor.getCursorPosition();
      editor.session.setValue(text);
      editor.moveCursorTo(Math.min(row, editor.session.getLength() - 1), column);
      editor.clearSelection();
    };

    // ---- 分支符号设置：默认 < localStorage < URL 参数 ----
    const loadStored = () => {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? {};
      } catch {
        return {};
      }
    };
    const hasUrlOverride = Object.keys(symbolsFromSearch(location.search)).length > 0;
    let symbols = resolveSymbols({ stored: loadStored(), urlSearch: location.search });
    const persist = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(symbols));
    if (hasUrlOverride) persist(); // URL 分享载入后写穿，刷新不丢

    // ---- 抽屉 ----
    const drawer = document.getElementById('symbol-drawer');
    const drawerToggle = document.getElementById('drawer-toggle');
    drawerToggle.addEventListener('click', () => {
      const open = drawer.classList.toggle('open');
      drawerToggle.setAttribute('aria-expanded', String(open));
    });

    const fields = {
      branch: document.getElementById('sym-branch'),
      branchLast: document.getElementById('sym-branch-last'),
      vertical: document.getElementById('sym-vertical'),
      horizontal: document.getElementById('sym-horizontal'),
      horizontalLength: document.getElementById('sym-hlen'),
    };
    const reflectFields = () => {
      fields.branch.value = symbols.branch;
      fields.branchLast.value = symbols.branchLast;
      fields.vertical.value = symbols.vertical;
      fields.horizontal.value = symbols.horizontal;
      fields.horizontalLength.value = String(symbols.horizontalLength);
    };
    const applySymbols = (next) => {
      symbols = { ...symbols, ...next };
      persist();
      reflectFields();
      renderTree();
    };
    for (const [key, el] of Object.entries(fields)) {
      el.addEventListener('input', () => {
        const value = key === 'horizontalLength' ? Number(el.value) : el.value;
        if (key === 'horizontalLength' && !(value >= 1 && value <= 8)) return;
        if (key !== 'horizontalLength' && value === '') return;
        applySymbols({ [key]: value });
      });
    }

    const presetRow = document.getElementById('preset-row');
    for (const [id, preset] of Object.entries(PRESETS)) {
      const btn = document.createElement('button');
      btn.textContent = preset.label;
      btn.dataset.preset = id;
      btn.addEventListener('click', () => applySymbols(preset.symbols));
      presetRow.appendChild(btn);
    }

    const copyFeedback = document.getElementById('copy-feedback');
    document.getElementById('copy-link').addEventListener('click', async () => {
      const url = `${location.origin}${location.pathname}${symbolsToSearch(symbols)}`;
      await navigator.clipboard.writeText(url);
      copyFeedback.textContent = '已复制';
      setTimeout(() => (copyFeedback.textContent = ''), 1500);
    });

    // ---- 错误行级标红（Ace marker）与状态条 ----
    let errorMarkerId = null;
    const showError = (line) => {
      clearErrorMarker();
      errorMarkerId = editor.session.addMarker(
        new Range(line - 1, 0, line - 1, 1),
        'ace-line-error',
        'fullLine',
      );
      statusText.textContent = `第 ${line} 行无法解析`;
      statusBar.classList.add('error');
    };
    const clearErrorMarker = () => {
      if (errorMarkerId !== null) {
        editor.session.removeMarker(errorMarkerId);
        errorMarkerId = null;
      }
    };
    const clearError = () => {
      clearErrorMarker();
      statusText.textContent = '就绪';
      statusBar.classList.remove('error');
    };

    function renderTree() {
      try {
        output.textContent = renderTreeText(parseMarkdown(editor.getValue()), symbols);
        clearError();
      } catch (err) {
        showError(err instanceof MarkdownParseError ? err.line : 1);
      }
    }

    // ---- 防抖同步 ----
    let timer = null;
    editor.session.on('change', () => {
      clearTimeout(timer);
      timer = setTimeout(renderTree, 300);
    });

    // 调试/验收钩子
    window.__indentree = {
      parseMarkdown,
      serializeMarkdown,
      renderTreeText,
      showError,
      clearError,
      getSymbols: () => symbols,
      applySymbols,
      rebuildEditor,
      editor,
    };

    applyTheme();
    reflectFields();
    renderTree();
  </script>
</body>
</html>
